apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cert-manager-webhook-oci.fullname" . }}
  labels:
    app: {{ include "cert-manager-webhook-oci.name" . }}
    chart: {{ include "cert-manager-webhook-oci.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cert-manager-webhook-oci.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "cert-manager-webhook-oci.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "cert-manager-webhook-oci.fullname" . }}
      # Disable auto-mount of the default service account token; we use a
      # projected token with the OCI audience required by OKE Workload Identity.
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secure-port=6443
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
            - name: OCI_RESOURCE_PRINCIPAL_VERSION
              value: {{ .Values.ociResourcePrincipal.version | quote }}
            {{- if .Values.ociResourcePrincipal.region }}
            - name: OCI_RESOURCE_PRINCIPAL_REGION
              value: {{ .Values.ociResourcePrincipal.region | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
            - name: oci-service-account-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "cert-manager-webhook-oci.servingCertificate" . }}
        - name: oci-service-account-token
          projected:
            sources:
              - serviceAccountToken:
                  # No audience specified — Kubernetes automatically uses the API
                  # server's configured audience, so this token is always accepted
                  # for in-cluster API calls regardless of cluster configuration.
                  expirationSeconds: 3600
                  path: token
              - serviceAccountToken:
                  # OCI authentication audience — used by OKE Workload Identity v2.2
                  # for the RPST exchange at {kubernetes-service-host}:12250.
                  audience: {{ include "cert-manager-webhook-oci.ociTokenAudience" . | quote }}
                  expirationSeconds: 3600
                  path: oci-token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
    {{- end }}
