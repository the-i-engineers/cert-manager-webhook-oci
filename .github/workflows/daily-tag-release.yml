name: Daily Tag Release

# Creates a semver tag daily from conventional commits.
# The tag is pushed via IENGINEER_API_TOKEN (PAT) so that GitHub fires the
# push.tags trigger in release.yml, which builds and publishes the Docker image + Helm chart.
#
# Uses: the-i-engineers/infrastructure/.github/workflows/scheduled-tag-release.yml@vX.Y.Z
# Bump rules: https://github.com/the-i-engineers/infrastructure/blob/main/docs/contributing/conventional-commits.md

on:
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC (04:30 CET / 05:30 CEST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Calculate next version without creating tags or releases'
        type: boolean
        default: false

jobs:
  tag:
    name: Daily semver tag
    permissions:
      contents: write
    uses: the-i-engineers/infrastructure/.github/workflows/scheduled-tag-release.yml@v2.13.0
    with:
      cadence: daily
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      GH_PAT: ${{ secrets.IENGINEER_API_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
