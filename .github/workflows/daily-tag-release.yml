name: Daily Tag Release

# Creates a semver tag daily from conventional commits.
# The tag push fires the push: tags trigger in release.yml via GH_PAT,
# which builds and publishes the Docker image + Helm chart.
#
# Bump rules: https://github.com/the-i-engineers/infrastructure/blob/main/docs/contributing/conventional-commits.md

on:
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC (04:30 CET / 05:30 CEST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Calculate next version without creating tags or releases'
        type: boolean
        default: false

concurrency:
  group: daily-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Daily semver tag
    permissions:
      contents: write
    uses: ./.github/workflows/scheduled-tag-release.yml
    with:
      cadence: daily
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
