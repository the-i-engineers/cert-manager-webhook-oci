name: Release

# Triggered automatically when daily-tag-release.yml pushes a semver tag via GH_PAT.
# The push: tags trigger fires only when the tag is pushed by a non-GITHUB_TOKEN identity
# (PAT), bypassing GitHub's suppression of GITHUB_TOKEN-originated events.
# Also supports manual dispatch for ad-hoc builds.
# Builds and publishes the Docker image (ghcr.io) and Helm chart (gh-pages).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.2)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and push Docker image + Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/the-i-engineers/cert-manager-webhook-oci
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            Version=${{ steps.ref.outputs.tag }}
            GitCommit=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Package Helm chart
        id: chart
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          VERSION="${TAG#v}"
          helm package deploy/cert-manager-webhook-oci \
            --version "$VERSION" \
            --app-version "$TAG"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tgz=cert-manager-webhook-oci-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Generate Helm repo index
        run: |
          set -euo pipefail
          CHART_URL="https://the-i-engineers.github.io/cert-manager-webhook-oci"
          mkdir -p gh-pages-dist
          cp "${{ steps.chart.outputs.tgz }}" gh-pages-dist/
          if curl -sf "${CHART_URL}/index.yaml" -o gh-pages-dist/old-index.yaml 2>/dev/null; then
            helm repo index gh-pages-dist --url "${CHART_URL}" --merge gh-pages-dist/old-index.yaml
            rm gh-pages-dist/old-index.yaml
          else
            helm repo index gh-pages-dist --url "${CHART_URL}"
          fi

      - name: Publish Helm chart to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          publish_branch: gh-pages
          keep_files: true
