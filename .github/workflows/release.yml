name: Release

# Triggered automatically when daily-tag-release.yml pushes a semver tag via GH_PAT.
# The push: tags trigger fires only when the tag is pushed by a non-GITHUB_TOKEN identity
# (PAT), bypassing GitHub's suppression of GITHUB_TOKEN-originated events.
# Also supports manual dispatch for ad-hoc builds.
# Builds and publishes the Docker image (ghcr.io) and Helm chart (gh-pages).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.2)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and push Docker image + Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/the-i-engineers/cert-manager-webhook-oci
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            Version=${{ steps.ref.outputs.tag }}
            GitCommit=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Package Helm chart
        id: chart
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          VERSION="${TAG#v}"
          helm package deploy/cert-manager-webhook-oci \
            --version "$VERSION" \
            --app-version "$TAG"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tgz=cert-manager-webhook-oci-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Generate Helm repo index
        run: |
          set -euo pipefail
          CHART_URL="https://the-i-engineers.github.io/cert-manager-webhook-oci"
          mkdir -p gh-pages-dist
          cp "${{ steps.chart.outputs.tgz }}" gh-pages-dist/
          if curl -sf "${CHART_URL}/index.yaml" -o gh-pages-dist/old-index.yaml 2>/dev/null; then
            helm repo index gh-pages-dist --url "${CHART_URL}" --merge gh-pages-dist/old-index.yaml
            rm gh-pages-dist/old-index.yaml
          else
            helm repo index gh-pages-dist --url "${CHART_URL}"
          fi

      - name: Publish Helm chart to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          publish_branch: gh-pages
          keep_files: true
