name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Integration Test
    # Only run on non-fork, non-Dependabot PRs.
    # Fork PRs and Dependabot-triggered pull_request workflows do not receive
    # repository secrets, so the integration test would always fail for both.
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      TEST_ZONE_NAME: ${{ secrets.OCI_TEST_ZONE_NAME }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Write OCI test credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          # config.json — compartmentOCID + secret name for ClusterIssuer config
          printf '{"compartmentOCID":"%s","ociProfileSecretName":"oci-profile"}\n' \
            "${OCI_COMPARTMENT_OCID}" > testdata/oci/config.json

          # oci-profile.yaml — OCI API key secret; use Python to indent the PEM
          # correctly as a YAML block scalar (envsubst breaks multiline keys)
          python3 - <<'EOF'
          import os, textwrap
          key = os.environ['OCI_PRIVATE_KEY'].strip()
          indented_key = textwrap.indent(key, '    ')
          yaml = (
              "apiVersion: v1\n"
              "kind: Secret\n"
              "metadata:\n"
              "  name: oci-profile\n"
              "type: Opaque\n"
              "stringData:\n"
              f"  tenancy: \"{os.environ['OCI_TENANCY_OCID']}\"\n"
              f"  user: \"{os.environ['OCI_USER_OCID']}\"\n"
              f"  region: \"{os.environ['OCI_REGION']}\"\n"
              f"  fingerprint: \"{os.environ['OCI_FINGERPRINT']}\"\n"
              "  privateKey: |\n"
              f"{indented_key}\n"
              "  privateKeyPassphrase: \"\"\n"
          )
          with open('testdata/oci/oci-profile.yaml', 'w') as f:
              f.write(yaml)
          EOF

      - name: Download kubebuilder test tools (setup-envtest)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          ASSETS=$(setup-envtest use 1.32.0 --bin-dir _test/kubebuilder/bin -p path)
          echo "TEST_ASSET_ETCD=${ASSETS}/etcd"               >> "$GITHUB_ENV"
          echo "TEST_ASSET_KUBE_APISERVER=${ASSETS}/kube-apiserver" >> "$GITHUB_ENV"
          echo "TEST_ASSET_KUBECTL=${ASSETS}/kubectl"          >> "$GITHUB_ENV"

      - name: Run integration tests
        run: go test -timeout 60s -v .

  status-check:
    needs: [build, test]
    if: always()
    uses: the-i-engineers/reusable-workflows/.github/workflows/status-check.yml@5.5.0
    with:
      result: >-
        ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
            && 'failure' || 'success' }}
