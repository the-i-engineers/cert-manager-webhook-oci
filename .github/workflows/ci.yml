name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    env:
      TEST_ZONE_NAME: tie-dev.ch.
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      TEST_ASSET_ETCD: _test/kubebuilder/bin/etcd
      TEST_ASSET_KUBE_APISERVER: _test/kubebuilder/bin/kube-apiserver
      TEST_ASSET_KUBECTL: _test/kubebuilder/bin/kubectl
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22'

      - name: Write OCI test credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          # config.json — compartmentOCID for ClusterIssuer config
          echo '{"compartmentOCID":"'"${OCI_COMPARTMENT_OCID}"'"}' > testdata/oci/config.json

          # oci-profile.yaml — OCI API key secret; use Python to indent the PEM
          # correctly as a YAML block scalar (envsubst breaks multiline keys)
          python3 - <<'EOF'
          import os, textwrap
          key = os.environ['OCI_PRIVATE_KEY'].strip()
          indented_key = textwrap.indent(key, '    ')
          yaml = (
              "apiVersion: v1\n"
              "kind: Secret\n"
              "metadata:\n"
              "  name: oci-profile\n"
              "type: Opaque\n"
              "stringData:\n"
              f"  tenancy: \"{os.environ['OCI_TENANCY_OCID']}\"\n"
              f"  user: \"{os.environ['OCI_USER_OCID']}\"\n"
              f"  region: \"{os.environ['OCI_REGION']}\"\n"
              f"  fingerprint: \"{os.environ['OCI_FINGERPRINT']}\"\n"
              "  privateKey: |\n"
              f"{indented_key}\n"
              "  privateKeyPassphrase: \"\"\n"
          )
          with open('testdata/oci/oci-profile.yaml', 'w') as f:
              f.write(yaml)
          EOF

      - name: Download kubebuilder test tools
        run: make _test/kubebuilder

      - name: Run integration tests
        run: go test -timeout 60s -v .

  ci-required:
    name: CI Required Check
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Integration test did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All checks passed"
